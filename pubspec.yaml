  ffi: ">=2.0.0 <3.0.0"
  js: ^0.6.7
  meta: ^1.9.1
  source_gen: ^2.0.0

dev_dependencies:
  build_test: ^2.2.0
  ffigen: ^8.0.2
  test: any
  very_good_analysis: ^5.0.0+1
